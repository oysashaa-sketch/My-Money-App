<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfaf8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Money">
  <meta name="description" content="Персональный офлайн-помощник для финансов, расходов и накоплений.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>My Money 0.3 · мой финансовый помощник</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div><div class="eyebrow">МОЙ ФИНАНСОВЫЙ НАВИГАТОР</div><h1 id="header-title">Главная</h1></div>
      <button id="open-settings" class="icon-btn" aria-label="Настройки">⚙</button>
    </header>
    <main id="main" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Основные разделы">
      <button class="tab active" data-page="home"><span>⌂</span><small>Главная</small></button>
      <button class="tab" data-page="transactions"><span>≡</span><small>История<br>операций</small></button>
      <button class="fab" id="new-operation" aria-label="Добавить операцию">+</button>
      <button class="tab" data-page="goals"><span>◎</span><small>Цели</small></button>
      <button class="tab" data-page="obligations"><span>▤</span><small>Запланированные<br>платежи</small></button>
    </nav>
    <dialog id="modal"><div class="modal-inner"><div class="modal-header"><h2 id="modal-title"></h2><button class="icon-btn" id="close-modal" aria-label="Закрыть">×</button></div><div id="modal-body"></div></div></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="finance.js" defer></script>
  <script src="planner.js" defer></script>
  <script src="planner-ui.js" defer></script>
  <script src="assistant-ui.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
